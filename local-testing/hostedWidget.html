    <style>
        /* ─── Custom "Chat now" pill launcher button ─── */
        #chat-now-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #8B005D;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(139, 0, 93, 0.4);
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }
        #chat-now-btn:hover {
        background-color: #a3006e;
        transform: scale(1.04);
        }
        #chat-now-btn:active {  
        transform: scale(0.97);
        }
        /* ─── Sparkle icon circle ─── */
        #chat-now-btn .btn-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        }
        #chat-now-btn .btn-icon svg {
        width: 15px;
        height: 15px;
        fill: #ffffff;
        }
        #chat-now-btn.widget-open {
            display: none !important;
        }
        #amazon-connect-close-widget-button {
            display: none !important;
        }
       div[class*="acWidgetContainer"] {
            overflow: visible !important;
            border-radius: 24px !important;
        }

        div[class*="acFrameContainer"] {
            border-radius: 24px !important;
        }
    </style>
</head>
