<!DOCTYPE html>
<html>

<head>
  <title>Hosted Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <link rel="stylesheet" href="./brand-theme.css">
  <script src="./brandInfo.js"></script>
  <style>
    /* ─── Custom "Chat now" pill launcher button ─── */
    #chat-now-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--launcher-color-default, #8B005D);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--launcher-shadow, 0 4px 16px rgba(139, 0, 93, 0.4));
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    #chat-now-btn:hover {
      background-color: var(--launcher-color-active, #a3006e);
      transform: scale(1.04);
    }

    #chat-now-btn:active {
      background-color: var(--launcher-color-active, #a3006e);
      transform: scale(0.97);
    }

    /* ─── Sparkle icon circle ─── */
    #chat-now-btn .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    #chat-now-btn .btn-icon svg {
      width: 15px;
      height: 15px;
      fill: #ffffff;
    }

    #chat-now-btn.widget-open {
      display: none !important;
    }

    #amazon-connect-close-widget-button {
      display: none !important;
    }

    div[class*="acWidgetContainer"] {
      overflow: visible !important;
      border-radius: 24px 24px 0 0 !important;
    }

    div[class*="acFrameContainer"] {
      border-radius: 24px 24px 0 0 !important;
    }
  </style>
</head>

<body>
  <button id="chat-now-btn" aria-label="Open chat">
    <span class="btn-icon">
      <!-- 4-point sparkle matching your design image -->
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M28 13.4826C28.0054 15.5762 27.5163 17.6414 26.5724 19.5102C25.4532 21.7495 23.7327 23.6329 21.6036 24.9496C19.4744 26.2663 17.0207 26.9643 14.5174 26.9652C12.4238 26.9707 10.3586 26.4816 8.48984 25.5377L1.25432 27.9495C0.510306 28.1975 -0.197519 27.4897 0.0504845 26.7457L2.46233 19.5102C1.51843 17.6414 1.0293 15.5762 1.03476 13.4826C1.03572 10.9793 1.73365 8.52557 3.05036 6.39643C4.36706 4.26729 6.25055 2.54678 8.48984 1.42761C10.3586 0.483724 12.4238 -0.00541329 14.5174 4.51875e-05H15.3104C18.6166 0.182444 21.7393 1.57792 24.0807 3.91929C26.4221 6.26066 27.8176 9.38338 28 12.6896V13.4826Z"
          fill="white" />
        <path
          d="M13.625 5.5846C13.9316 4.75602 15.1036 4.75602 15.4102 5.5846L17.1504 10.2876C17.2468 10.5481 17.4522 10.7535 17.7127 10.8499L22.4157 12.5901C23.2443 12.8967 23.2443 14.0687 22.4157 14.3753L17.7127 16.1155C17.4522 16.2119 17.2468 16.4173 17.1504 16.6778L15.4102 21.3808C15.1036 22.2094 13.9316 22.2094 13.625 21.3808L11.8848 16.6778C11.7884 16.4173 11.583 16.2119 11.3225 16.1155L6.61949 14.3753C5.79091 14.0687 5.79092 12.8967 6.61949 12.5901L11.3225 10.8499C11.583 10.7535 11.7884 10.5481 11.8848 10.2876L13.625 5.5846Z"
          fill="#36563D" />
      </svg>
    </span>
    Chat now
  </button>

  <script type="text/javascript">
    (function (w, d, x, id) {
      s = d.createElement('script');
       s.src='https://elc-connect-sandbox.my.connect.aws/connectwidget/static/amazon-connect-chat-interface-client.js';
      s.async = 1;
      s.id = id;
      d.getElementsByTagName('head')[0].appendChild(s);
      w[x] = w[x] || function () { (w[x].ac = w[x].ac || []).push(arguments) };
    })(window, document, 'amazon_connect', '01f66d6e-2817-4aee-9071-b897dd6dbf23');

    const brandConfig = window.__CHAT_BRAND_INFO__?.config || {};
    const brandColors = brandConfig.colors || {};
    const openColor = brandConfig.headerTextColor || '#ffffff';
    const openBg = brandColors.primary500 || brandConfig.primaryColor || '#123456';
    const closeBg = brandColors.primary800 || brandConfig.secondaryColor || openBg;

    // Launcher icon (Default/Hover/Pressed) is driven by the brand's
    // Primary500/Primary800 tokens - same source the header background uses -
    // so switching brands updates it with no code changes.
    function hexToRgba(hex, alpha) {
      const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!match) return null;
      const [r, g, b] = match.slice(1).map(c => parseInt(c, 16));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    const launcherDefault = brandColors.primary500 || brandConfig.primaryColor;
    const launcherActive = brandColors.primary800 || launcherDefault;
    if (launcherDefault) {
      document.documentElement.style.setProperty('--launcher-color-default', launcherDefault);
      const shadow = hexToRgba(launcherDefault, 0.4);
      if (shadow) document.documentElement.style.setProperty('--launcher-shadow', `0 4px 16px ${shadow}`);
    }
    if (launcherActive) {
      document.documentElement.style.setProperty('--launcher-color-active', launcherActive);
    }

    amazon_connect('styles', {
      iconType: 'CHAT_VOICE',
      openChat: { color: openColor, backgroundColor: openBg },
      closeChat: { color: openColor, backgroundColor: closeBg }
    });
    amazon_connect('snippetId', 'QVFJREFIaUYzWWsrMWRnRDlkczNlcXlOOW53N0RzaVdJdlpUUXhxcmxDcHgzM0xWdXdFOWd4ZzBPek1jclQ5Sm1RbU1SdFZFQUFBQWJqQnNCZ2txaGtpRzl3MEJCd2FnWHpCZEFnRUFNRmdHQ1NxR1NJYjNEUUVIQVRBZUJnbGdoa2dCWlFNRUFTNHdFUVFNZmdNS0ZTeDRkazY1cllaY0FnRVFnQ3VTZng5N2xUM1Z3bFYrQkNyUjRLZmdGTmYwdkhaSVAvaHJOVGErTENlOUVzNGhiQnkyWVNZSURpVW06Om15L01OMThVc0RkTXF0VENZbk1FUEh0UGduMDZIb0J4aFF2T2l3dVN3elZHSEtQNU4wZGVkMjNPUnNXYW9vU2lSY1JKb0NtS3BqTWN4c0JkVGhLQWJDSTlpYmdaVFdKREREcitjeUdnTFhsOHAzZXd0RHluMFNMTU1hdk0zM2NwZnlONTBkSWYyRmd2TG9pUTB1UHRneWRyelR2N2JDOD0=');
    amazon_connect('supportedMessagingContentTypes', ['text/plain', 'text/markdown', 'application/vnd.amazonaws.connect.message.interactive', 'application/vnd.amazonaws.connect.message.interactive.response']);
    amazon_connect('customerChatInterfaceUrl', './amazon-connect-chat-interface.js');
    amazon_connect('customizationObject', {
      headerConfig: brandConfig.header,
      composer: {
        disableEmojiPicker: true,
        disableCustomerAttachment: true,
      },
    });

    amazon_connect('customStartChat', async function (callback) {
      try {
        const response = await fetch(brandConfig.apiGatewayEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: 'Guest',
            customerId: '',
            pageUrl: window.location.href,
            brand: brandConfig.brand || 'demo-brand',
          })
        });

        const data = await response.json();
        console.log('Raw API response:', data);

        // Parse the body since Lambda returns it as a string
        const body = typeof data.body === 'string'
          ? JSON.parse(data.body)
          : data;

        console.log('Parsed body:', body);

        // Pass in exact format widget expects
        callback({
          startChatResult: body.startChatResult,
          featurePermissions: body.featurePermissions
        });

      } catch (error) {
        console.error('Failed to start chat:', error);
      }
    });

    amazon_connect('customLaunchBehavior', {
      skipIconButtonAndAutoLaunch: true,   // ✅ MUST be true
      alwaysHideWidgetButton: true,        // ✅ hides Amazon's default button

      programmaticLaunch: function (launchCallback) {
        // ✅ Store launchCallback globally so button click can use it
        //    regardless of when this function runs vs when DOM is ready
        window._connectLaunchCallback = launchCallback;

        var btn = document.getElementById('chat-now-btn');
        if (btn) {
          // Button already in DOM — attach directly
          btn.addEventListener('click', launchCallback);
        }
        // If btn is null here, the DOMContentLoaded handler below covers it
      }
    });
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('chat-now-btn');
      if (btn && window._connectLaunchCallback) {
        // Avoid double-binding — remove any existing listener first
        btn.removeEventListener('click', window._connectLaunchCallback);
        btn.addEventListener('click', window._connectLaunchCallback);
      }
      setTimeout(() => {
        const widgetContainer = document.querySelector('div[class*="acWidgetContainer"]');
        if (widgetContainer) {
          widgetContainer.style.overflow = 'visible';
          widgetContainer.style.borderRadius = '24px 24px 0 0';
        }

        const frameContainer = document.querySelector('div[class*="acFrameContainer"]');
        if (frameContainer) {
          frameContainer.style.borderRadius = '24px 24px 0 0';
          // Apply radius on iframe to handle white corner bleed
          const iframe = frameContainer.querySelector('iframe');
          if (iframe) {
            iframe.style.borderRadius = '24px 24px 0 0';
          }
        }
      }, 1000);
    });
  </script>

</body>

</html>
